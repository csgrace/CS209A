spring.application.name=FinalProject_demo
server.port=${PORT:8081}

# Render supplies these secrets at deployment time. Local defaults preserve the existing workflow.
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/cs209a_grace}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=org.postgresql.Driver

# The application creates/imports the analysis schema on an empty deployment database.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

logging.level.root=INFO
logging.level.cs209a.finalproject_demo=DEBUG
logging.level.org.springframework.jdbc.core=TRACE

# Relative to FinalProject_demo when deployed from this Maven subdirectory.
data.directory=${DATA_DIRECTORY:../data_2000_new}
app.name=StackOverflow Java Questions Analyzer
app.version=1.0.0
